[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-sender"
version = "1.0.0"
description = "CLI para envio de e-mails via SMTP com templates, anexos e envio em lote a partir de CSV."
readme = "README.md"
authors = [{ name = "Caio Henrique Nepomuceno Santos" }]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
email-sender = "email_sender.cli:main"

[project.urls]
Repositorio = "https://github.com/CaioNepomuceno2/email-sender-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
